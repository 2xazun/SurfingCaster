<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>즐겨찾기 | SurfingCaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div class="main-container">
      <aside class="left-panner highlight-page">
        <header class="topbar">
          <a href="/index.html" class="logo-link"
            ><img class="logo-image" src="assets/icons/logo.svg" alt="SurfingCaster"
          /></a>
        </header>

        <div class="page-header">
          <a href="/myPage.html" class="back-link" aria-label="마이페이지로"
            ><img class="back" src="assets/icons/Back.svg" alt=""
          /></a>
          <h1 class="page-title">내 즐겨찾기 바다</h1>
        </div>

        <p class="highlight-detail">
          이름을 누르면 그 바다의 지금 상태를 보여줘요. 새 바다는 지도에서 마커를 두 번 눌러
          담을 수 있어요.
        </p>

        <ul class="highlight-list"></ul>
      </aside>

      <main class="map-container">
        <div id="map"></div>
        <ul class="map-legend" aria-label="파고 색 안내">
          <li data-sea="calm">잔잔 ~0.5m</li>
          <li data-sea="good">서핑 적기 ~2m</li>
          <li data-sea="rough">위험 2m~</li>
        </ul>
      </main>
    </div>

    <!-- 스크립트 연결 순서 (config -> kakao -> stations -> api -> map) -->
    <script src="js/config.js"></script>

    <!-- 카카오 SDK 동적 로드 -->
    <script>
      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      document.head.appendChild(script);
    </script>

    <!-- 데이터 및 지도 로직 -->
    <script src="js/stations.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/spots.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
