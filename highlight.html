<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurfingCaster</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- 왼쪽 정보 사이드바 (40%) -->
      <div class="left-panner">
        <img class="logo-image" src="assets/icons/logo.svg" alt="로고" />

        <div class="highlight-page">
          <div class="header">
            <a href="/myPage.html"
              ><img class="back" src="assets/icons/Back.svg" alt=""
            /></a>
            <h3>즐겨찾기</h3>
          </div>
          <div class="highlight-detail">마커를 더블클릭 하면 등록됩니다!</div>

          <ul class="highlight-list">
            <li>양양 해수욕장 <button class="delete">삭제</button></li>
          </ul>
        </div>
      </div>

      <!-- 오른쪽 지도 영역 (60%) -->
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <!-- 스크립트 연결 순서 (config -> kakao -> stations -> api -> map) -->
    <script src="js/config.js"></script>

    <!-- 카카오 SDK 동적 로드 -->
    <script>
      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      document.head.appendChild(script);
    </script>

    <!-- 데이터 및 지도 로직 -->
    <script src="js/stations.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/myPage.js"></script>
  </body>
</html>
