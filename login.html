<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | SurfingCaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/signup-login-style.css" />
  </head>
  <body>
    <header class="auth-headline">
      <h1>오늘 파도, 같이 보러 갈까요?</h1>
      <p class="auth-sub">로그인하고 내 바다를 즐겨찾기에 담아보세요</p>
    </header>

    <form class="box-cotainer" id="login-form" novalidate>
      <a href="/index.html" class="logo-link"
        ><img class="logo-image" src="assets/icons/logo.svg" alt="SurfingCaster 메인으로"
      /></a>

      <label for="login-id">아이디</label>
      <input type="text" id="login-id" placeholder="아이디를 입력하세요" autocomplete="username" />

      <label for="login-password">비밀번호</label>
      <input
        type="password"
        id="login-password"
        placeholder="비밀번호를 입력하세요"
        autocomplete="current-password"
      />

      <p class="form-message" id="login-message" role="alert"></p>
      <button type="submit">로그인</button>

      <p class="switch">처음 오셨나요?<a href="/signup.html">회원가입</a></p>
    </form>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
