<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurfingCaster | 오늘 파도 어때?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body data-sea="good">
    <!-- 첫 로딩/알림용 토스트 -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <span class="toast-message"></span>
    </div>

    <div class="main-container">
      <!-- 왼쪽 정보 사이드바 -->
      <aside class="left-panner">
        <header class="topbar">
          <a href="/index.html" class="logo-link"
            ><img class="logo-image" src="assets/icons/logo.svg" alt="SurfingCaster"
          /></a>
          <a href="/myPage.html" class="account-link">로그인</a>
        </header>

        <div class="search-container">
          <input
            type="search"
            class="search"
            placeholder="어느 바다로 갈까요? 예) 해운대, 양양"
            aria-label="해변 검색"
          />
          <div class="search-list hidden"></div>
        </div>

        <!-- 메인: 지금 바다 상태 -->
        <section class="sea-card" aria-label="실시간 바다 상태">
          <div class="sea-card-top">
            <p class="current-station">바다를 고르는 중…</p>
            <span class="wave-source"></span>
          </div>

          <p class="wave-number">
            <span class="wave-height">-</span><span class="wave-unit">m</span>
          </p>
          <p class="surf-verdict"><span class="wave-level">파도 정보를 불러오고 있어요</span></p>

          <object
            id="wave-bg"
            type="image/svg+xml"
            data="./assets/icons/wave.svg"
            class="wave"
            aria-hidden="true"
          ></object>
        </section>

        <!-- 세부 정보 -->
        <dl class="sea-stats">
          <div class="stat">
            <dt>수온</dt>
            <dd><span class="TMP">-</span><small>℃</small></dd>
          </div>
          <div class="stat">
            <dt>바람</dt>
            <dd><span class="V">-</span><small>m/s</small></dd>
          </div>
          <div class="stat stat-wide">
            <dt>물때</dt>
            <dd class="Tide">-</dd>
          </div>
        </dl>

        <section class="top-spots" aria-labelledby="top-spots-title">
          <h2 id="top-spots-title" class="section-title">지금 서핑하기 좋은 바다</h2>
          <ol class="top-spots-list">
            <li class="top-spots-empty">전국 21곳의 파도를 살펴보는 중…</li>
          </ol>
        </section>

        <p class="map-hint">
          지도에서 마커를 <b>한 번</b> 누르면 바다 상태를, <b>두 번</b> 누르면 즐겨찾기에
          담아요.
        </p>
      </aside>

      <!-- 오른쪽 지도 -->
      <main class="map-container">
        <div id="map"></div>
        <ul class="map-legend" aria-label="파고 색 안내">
          <li data-sea="calm">잔잔 ~0.5m</li>
          <li data-sea="good">서핑 적기 ~2m</li>
          <li data-sea="rough">위험 2m~</li>
        </ul>
      </main>
    </div>

    <!-- 스크립트 연결 순서 (config -> kakao -> stations -> api -> map) -->
    <script src="js/config.js"></script>

    <!-- 카카오 SDK 동적 로드 -->
    <script>
      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      document.head.appendChild(script);
    </script>

    <!-- 데이터 및 지도 로직 -->
    <script src="js/stations.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/spots.js"></script>
    <script src="js/map.js"></script>
    <script src="js/search.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
