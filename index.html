<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div class="main-container">
      <div class="left-panner">
        <img class="logo-image" src="assets/icons/logo.svg" alt="로고" />
        <div class="information-container">
          <input
            type="text"
            class="search"
            placeholder="⌕  해변을 검색하세요..."
          />
          <div class="informations">
            <img
              class="highlighting"
              src="assets/icons/Highlighting.svg"
              alt="즐겨찾기"
            />
            <ul>
              <li>양양 죽도 해변 <button class="delete">삭제</button></li>
              <li>속초 해수욕장 <button class="delete">삭제</button></li>
            </ul>
            <img
              class="live"
              src="assets/icons/live.svg"
              alt="실시간 바다 상태"
            />
            <div class="sea-situation">
              <div class="wave"></div>
              <div class="wave-information">현재 파고: 1.8m (조금 높음!)</div>
            </div>
            <img class="detail" src="assets/icons/detail.svg" alt="" />
            <ul>
              <li>실시간 수온 : 21°C</li>
              <li>풍향/풍속 : 남서풍 5.2m/s</li>
              <li>오늘 물때 : 만조 14:20</li>
            </ul>
          </div>
        </div>
      </div>
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>
  </body>
</html>
