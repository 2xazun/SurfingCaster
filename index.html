<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurfingCaster</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
    <!-- 테일윈드 -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- 페이지 첫 로딩 때만 사용하는 토스트바 -->
    <div
      id="toast"
      class="fixed top-6 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-lg opacity-0 invisible translate-y-[-10px] transition-all duration-300 z-[9999]"
    >
      <span class="text-blue-400">ⓘ</span>
      <span class="toast-message text-sm"></span>
    </div>
    <div class="main-container">
      <!-- 왼쪽 정보 사이드바 (40%) -->
      <div class="left-panner">
        <a href="/index.html"
          ><img class="logo-image" src="assets/icons/logo.svg" alt="로고"
        /></a>
        <div class="information-container">
          <div class="search-container">
            <a href="/myPage.html"
              ><img class="profile-image" src="assets/icons/Profile.svg" alt=""
            /></a>
            <input
              type="text"
              class="search"
              placeholder="⌕  해변을 검색하세요..."
            />
            <div class="search-list hidden"></div>
          </div>

          <div class="informations">
            <div class="informations-items">
              <img
                class="live"
                src="assets/icons/live.svg"
                alt="실시간 바다 상태"
              />
              <div class="sea-situation">
                <object
                  id="wave-bg"
                  type="image/svg+xml"
                  data="./assets/icons/wave.svg"
                  class="wave"
                ></object>
                <div class="wave-information">
                  현재 파고: <span class="wave-height"></span> m (<span
                    class="wave-level"
                  ></span
                  >)
                </div>
              </div>
            </div>

            <div class="informations-items">
              <img
                class="detail"
                src="assets/icons/detail.svg"
                alt="세부 정보"
              />
              <ul>
                <li>
                  실시간 수온 :
                  <span class="TMP"></span>℃
                </li>
                <li>풍향/풍속 : <span class="V"></span>m/s</li>
                <li>오늘 물때 : <span class="Tide"></span></li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- 오른쪽 지도 영역 (60%) -->
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <!-- 스크립트 연결 순서 (config -> kakao -> stations -> api -> map) -->
    <script src="js/config.js"></script>

    <!-- 카카오 SDK 동적 로드 -->
    <script>
      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      document.head.appendChild(script);
    </script>

    <!-- 데이터 및 지도 로직 -->
    <script src="js/stations.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/myPage.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 더미데이터
        const stations = [
          {
            id: "ST_001",
            name: "양양 죽도 해변",
            lat: 37.9691,
            lng: 128.7601,
            beachCode: "1",
            obsCode: "TW_0090",
          },
          {
            id: "ST_002",
            name: "속초 해수욕장",
            lat: 38.1906,
            lng: 128.6034,
            beachCode: "2",
            obsCode: "TW_0091",
          },
        ];
        // 저장된 장소 데이터 가져오기
        const stationData = sessionStorage.getItem("selectedStation");

        if (stationData) {
          // 문자열을 객체로 변환
          const findStation = JSON.parse(stationData);

          // 장소 정보 출력
          if (findStation) {
            dataLoad(findStation);
          }

          // 사용한 데이터 삭제
          sessionStorage.removeItem("selectedStation");
        } else {
          const findStation = stations[0];

          // 장소 정보 출력
          if (findStation) {
            dataLoad(findStation);

            showToast(
              `첫 번째 즐겨찾기 장소인 ${findStation.name}의 정보를 보여드리고 있어요.`,
            );
          }
        }
      });
    </script>
  </body>
</html>
