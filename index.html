<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurfingCaster</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- 왼쪽 정보 사이드바 (40%) -->
      <div class="left-panner">
        <img class="logo-image" src="assets/icons/logo.svg" alt="로고" />
        <div class="information-container">
          <input
            type="text"
            class="search"
            placeholder="⌕  해변을 검색하세요..."
          />
          <div class="informations">
            <img
              class="highlighting"
              src="assets/icons/Highlighting.svg"
              alt="즐겨찾기"
            />
            <ul>
              <li>양양 죽도 해변 <button class="delete">삭제</button></li>
              <li>속초 해수욕장 <button class="delete">삭제</button></li>
            </ul>
            <img
              class="live"
              src="assets/icons/live.svg"
              alt="실시간 바다 상태"
            />
            <div class="sea-situation">
              <div class="wave"></div>
              <div class="wave-information">현재 파고: 1.8m (조금 높음!)</div>
            </div>
            <img class="detail" src="assets/icons/detail.svg" alt="세부 정보" />
            <ul>
              <li>실시간 수온 : 21°C</li>
              <li>풍향/풍속 : 남서풍 5.2m/s</li>
              <li>오늘 물때 : 만조 14:20</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- 오른쪽 지도 영역 (60%) -->
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <!-- 스크립트 연결 순서 (config -> kakao -> stations -> api -> map) -->
    <script src="js/config.js"></script>

    <!-- 카카오 SDK 동적 로드 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=c1230cfcb54654f720682c84a38e2c76&autoload=false"></script>

    <!-- 데이터 및 지도 로직 -->
    <script src="js/stations.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
  </body>
</html>
