<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurfingCaster</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/theme.css" />
  </head>
  <body>
    <div class="main-container">
      <!-- 왼쪽 정보 사이드바 (40%) -->
      <div class="left-panner">
        <img class="logo-image" src="assets/icons/logo.svg" alt="로고" />
        <div class="myPage">
          <div class="header">
            <a href="/index.html"
              ><img class="back" src="assets/icons/Back.svg" alt=""
            /></a>
            <h3>마이페이지</h3>
          </div>

          <div class="informations">
            <img src="assets/icons/Profile.svg" alt="" style="width: 200px" />
            <div class="userItems">
              <div>ID : <span class="id"></span></div>
              <div>이름 : <span class="name"></span></div>
            </div>

            <a href="/highlight.html" class="userItems">즐겨찾기</a>
            <button class="logout-button">로그아웃</button>
          </div>
        </div>
      </div>

      <!-- 오른쪽 지도 영역 (60%) -->
      <div class="map-container">
        <div id="map"></div>
      </div>
    </div>

    <!-- 스크립트 연결 순서 (config -> kakao -> stations -> api -> map) -->
    <script src="js/config.js"></script>

    <!-- 카카오 SDK 동적 로드 -->
    <script>
      const script = document.createElement("script");
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${CONFIG.KAKAO_MAP_KEY}&autoload=false`;
      document.head.appendChild(script);
    </script>

    <!-- 데이터 및 지도 로직 -->
    <script src="js/stations.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/search.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/myPage.js"></script>
  </body>
</html>
