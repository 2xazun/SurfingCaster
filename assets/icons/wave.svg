

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%" preserveAspectRatio="none" calcMode="spline">
  <defs>
    <style>
      :root{
        --wave-color-1: #A9E3D5;
        --wave-color-2: #AEE7D7;
        --wave-color-3: #A6DFD0;
      }

      .wave-layer-1{
        fill: var(--wave-color-1);
        opacity: 0.5;
      }
      .wave-layer-2{
        fill: var(--wave-color-2);
        opacity: 0.7;
      }
      .wave-layer-3{
        fill: var(--wave-color-3);
        opacity: 0.7;
      }
    </style>
  </defs>
  <!-- 레이어 1: 맨 뒤-->
  <path class="wave-layer-1">
    <!-- d(모양 좌표) 자체를 실시간 변형 -->
    <animate attributeName="d"
             dur="8s"
             repeatCount="indefinite"
             values="
               M 0 120 Q 250 60 500 120 T 1000 120 V 300 H 0 Z;
               M 0 100 Q 250 160 500 90 T 1000 100 V 300 H 0 Z;
               M 0 140 Q 250 80 500 130 T 1000 140 V 300 H 0 Z;
               M 0 120 Q 250 60 500 120 T 1000 120 V 300 H 0 Z
             " />
  </path>
  <!-- 레이어 2: 중간 -->
  <path class="wave-layer-2">
    <animate attributeName="d"
             dur="6s"
             repeatCount="indefinite"
             values="
               M 0 130 Q 250 170 500 100 T 1000 130 V 300 H 0 Z;
               M 0 110 Q 250 70 500 140 T 1000 110 V 300 H 0 Z;
               M 0 150 Q 250 120 500 80 T 1000 150 V 300 H 0 Z;
               M 0 130 Q 250 170 500 100 T 1000 130 V 300 H 0 Z
             " />
  </path>

  <!-- 레이어 3: 맨 앞 -->
  <path class="wave-layer-3">
    <animate attributeName="d"
             dur="4s"
             repeatCount="indefinite"
             values="
               M 0 100 Q 250 80 500 140 T 1000 100 V 300 H 0 Z;
               M 0 140 Q 250 150 500 90 T 1000 130 V 300 H 0 Z;
               M 0 90 Q 250 100 500 120 T 1000 90 V 300 H 0 Z;
               M 0 100 Q 250 80 500 140 T 1000 100 V 300 H 0 Z
             " />
  </path>

</svg>
